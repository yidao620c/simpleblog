{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "注册" %}{% endblock %}
{% block page %}
<section class="content auth-page">
  <h1>{% translate "注册" %}</h1>
  <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">{% translate "创建账号" %}</button></form>
  <p>{% translate "已有账号？" %}<a href="{% url 'blog:login' %}">{% translate "登录" %}</a></p>
</section>
{% endblock %}
